<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doğalgaz Fatura Hesaplayıcı</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-xl p-6 space-y-6">
        
        <!-- Başlık -->
        <div class="text-center space-y-1">
            <h1 class="text-xl font-bold tracking-tight text-white">GAZDAŞ Fatura Hesaplayıcı</h1>
            <p class="text-xs text-slate-400">Trakya Bölgesi Konut Tarifesi</p>
        </div>

        <!-- Form Alanı -->
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Önceki Fatura Endeksi (m³)</label>
                <input type="number" id="baslangicEndeks" value="4683" oninput="hesapla()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 text-lg">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Şu Anki Sayaç Endeksi (m³)</label>
                <input type="number" id="guncelEndeks" value="4740" oninput="hesapla()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 text-lg">
            </div>
        </div>

        <!-- Sonuç Kartı -->
        <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-3">
            <div class="flex justify-between items-center text-sm">
                <span class="text-slate-400">Tüketilen Miktar:</span>
                <span id="tuketimMiktari" class="font-semibold text-white">0 m³</span>
            </div>
            <div class="flex justify-between items-center text-sm">
                <span class="text-slate-400">Devlet Desteği:</span>
                <span id="devletDestegi" class="font-semibold text-emerald-400">0 TL</span>
            </div>
            <div class="border-t border-slate-800 pt-3 flex justify-between items-center">
                <span class="text-base font-bold text-white">Ödenecek Tutar:</span>
                <span id="odenecekTutar" class="text-2xl font-black text-blue-400">0 TL</span>
            </div>
        </div>

    </div>

    <script>
        function hesapla() {
            const baslangic = parseFloat(document.getElementById('baslangicEndeks').value) || 0;
            const guncel = parseFloat(document.getElementById('guncelEndeks').value) || 0;
            
            const tuketim = Math.max(0, guncel - baslangic);
            document.getElementById('tuketimMiktari').innerText = tuketim.toFixed(2) + " m³";

            const katsayi = 0.98665;
            const kdvDahilBirimFiyat = 16.908506; 

            const sm3Tuketim = tuketim * katsayi;
            const hamTutar = sm3Tuketim * kdvDahilBirimFiyat;

            const destekOrani = 340.08 / 970.74; 
            const devletDestegiTutar = hamTutar * destekOrani;
            const netTutar = hamTutar - devletDestegiTutar;

            document.getElementById('devletDestegi').innerText = "-" + devletDestegiTutar.toFixed(2) + " TL";
            document.getElementById('odenecekTutar').innerText = netTutar.toFixed(2) + " TL";
        }

        // Sayfa açıldığında ilk hesaplamayı yap
        hesapla();
    </script>
</body>
</html>
